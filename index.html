/* Suite du parcours et historique */
.next-steps{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;background:var(--soft);border-radius:24px;padding:30px 36px;margin:8px 0 12px}
.next-steps h2{font-size:26px;margin:0 0 10px}
.next-steps p{margin:0}
.next-steps .eyebrow{margin-bottom:10px}
.next-actions{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.next-actions .quiet-label{margin:2px 0 10px;color:var(--muted)}
.favs{display:grid;gap:10px;margin-top:8px}
.history{padding:8px 0 20px}
.theme-split{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.split-pill{display:inline-flex;gap:8px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:7px 14px;font-size:14px;color:var(--muted)}
.split-pill strong{font-family:var(--font-display);font-size:16px;color:var(--ink)}
.month-label{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:26px 0 8px;font-family:var(--font-body);font-weight:700}
.history-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.history-row{display:flex;align-items:center;gap:20px;padding:16px 4px;border-bottom:1px solid var(--line)}
.history-date{flex:0 0 150px;font-size:14px;color:var(--muted)}.history-date::first-letter{text-transform:uppercase}
.history-main{flex:1;min-width:0}
.history-main strong{font-family:var(--font-display);font-size:17px;display:block}
.history-main small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.history-row .text-button{padding:6px 0;flex-shrink:0}
@media(max-width:800px){.next-steps{grid-template-columns:1fr;padding:26px 24px}}
@media(max-width:520px){.history-row{flex-wrap:wrap;gap:4px 12px}.history-date{flex-basis:100%}.history-main{flex-basis:calc(100% - 80px)}.next-steps h2{font-size:22px}}

/* Marque ARISE : le cerveau tourne sur lui-même en continu. Sa largeur suit la projection d'un vrai tour (cosinus),
   avec un plancher doux : de profil il reste une fine tranche visible. Le cerveau étant symétrique, un demi-tour (2,5 s)
   se répète sans à-coup. Arrêté si l'utilisateur réduit les animations. */
.brand{letter-spacing:.08em}
.brand-icon svg{animation:arise-spin 2.5s linear infinite;will-change:transform}
@keyframes arise-spin{0.000%{transform:scaleX(1.000)}4.167%{transform:scaleX(0.992)}8.333%{transform:scaleX(0.967)}12.500%{transform:scaleX(0.926)}16.667%{transform:scaleX(0.869)}20.833%{transform:scaleX(0.798)}25.000%{transform:scaleX(0.715)}29.167%{transform:scaleX(0.620)}33.333%{transform:scaleX(0.516)}37.500%{transform:scaleX(0.406)}41.667%{transform:scaleX(0.296)}45.833%{transform:scaleX(0.197)}50.000%{transform:scaleX(0.148)}54.167%{transform:scaleX(0.197)}58.333%{transform:scaleX(0.296)}62.500%{transform:scaleX(0.406)}66.667%{transform:scaleX(0.516)}70.833%{transform:scaleX(0.620)}75.000%{transform:scaleX(0.715)}79.167%{transform:scaleX(0.798)}83.333%{transform:scaleX(0.869)}87.500%{transform:scaleX(0.926)}91.667%{transform:scaleX(0.967)}95.833%{transform:scaleX(0.992)}100.000%{transform:scaleX(1.000)}}
/* ===== Thème « candy sérénité » : pastels sucrés, formes rondes, polices douces ===== */
:root{--gloss:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 55%)}
body{font-family:var(--font-body);font-size:17px;background:radial-gradient(900px 420px at 100% -8%,var(--pink-soft),transparent 60%),radial-gradient(800px 420px at -8% 0,var(--mint-soft),transparent 58%),var(--paper);background-repeat:no-repeat;color:var(--ink)}
h1,h2,h3,.brand,.summary-card>strong,.journey-row strong,.history-main strong,.day strong,.site-header nav button,.primary-button{font-family:var(--font-display);letter-spacing:0}
h1{font-weight:600}h2,h3{font-weight:600}
.brand{font-size:28px;font-weight:700;letter-spacing:.06em}
.eyebrow,.card-meta span:first-child{text-transform:lowercase;letter-spacing:.02em;font-size:14px;font-weight:800;color:var(--blue)}
.eyebrow::first-letter,.card-meta span:first-child::first-letter,.month-label::first-letter{text-transform:uppercase}
.month-label{text-transform:none;letter-spacing:0;font-size:15px;color:var(--blue);font-family:var(--font-display);font-weight:500}
.site-header nav button{font-size:16px;font-weight:500}
.site-header nav button.nav-active{border-bottom-width:3px}
.brand-icon{background:var(--lemon-soft)}
.small-tag{background:var(--surface);border-width:2px;font-weight:700}

/* Boutons bonbon : relief, reflet, enfoncement au clic */
.primary-button{font-size:17px;font-weight:600;border-radius:18px;padding:14px 26px;background-image:var(--gloss);box-shadow:0 5px 0 var(--btn-edge);transition:transform .08s,box-shadow .08s,background-color .15s}
.primary-button:hover{background-color:var(--btn-hover);background-image:var(--gloss)}

(function () {

var D = {"activities": {"outside": [{"title": "Regarder, vraiment.", "body": "Sors ou installe-toi près d’une fenêtre. Téléphone posé, remarque trois détails que tu n’avais jamais vus : une couleur, une forme, un mouvement.", "prompt": "Décris un de ces détails comme si tu voulais le faire découvrir à quelqu’un qui n’était pas là.", "tip": "Tu n’as pas besoin d’aller loin. Un endroit familier peut devenir une découverte."}, {"title": "Écouter ce qui est là.", "body": "Dans un lieu où tu peux rester en sécurité, écoute les sons autour de toi. Repère un son proche, un son lointain et les silences entre les deux.", "prompt": "Décris le lieu en utilisant uniquement ce que tu as entendu.", "tip": "Essaie ce moment sans écouteurs, si cela te convient."}, {"title": "Un lieu, un souvenir.", "body": "Observe un lieu ou un objet dehors. Laisse venir un souvenir ou une association d’idées, sans chercher à vérifier quoi que ce soit sur ton téléphone.", "prompt": "Commence par « Cet endroit me rappelle… » et poursuis avec tes propres mots.", "tip": "Le souvenir peut être minuscule. Il n’a pas besoin d’être extraordinaire."}, {"title": "Changer de point de vue.", "body": "Choisis une petite promenade adaptée à tes possibilités, ou change simplement de place. Observe comment un même endroit semble différent depuis ce nouveau point de vue.", "prompt": "Qu’as-tu découvert en changeant de place ? Décris un avant et un après.", "tip": "Choisis un trajet connu et sûr. Adapte la distance à ton énergie."}, {"title": "Ramener une idée.", "body": "Cherche dehors une couleur, une texture ou une forme qui t’inspire. Garde-la en mémoire pour en faire ensuite un dessin ou quelques lignes sur papier.", "prompt": "Dessine ton détail de mémoire, puis écris une phrase pour l’accompagner.", "tip": "Pas besoin de photo ni de modèle. Ton interprétation suffit."}, {"title": "Un moment à deux.", "body": "Propose à une personne de marcher, de regarder dehors ou de discuter avec les téléphones rangés. Si tu préfères rester seul, observe un lieu où les gens se rencontrent.", "prompt": "Quelle phrase ou quel détail de ce moment aimerais-tu conserver ?", "tip": "Partager est une invitation. Tu peux choisir de rester seul."}, {"title": "Ce que tu veux garder.", "body": "Reprends le moment dehors que tu as préféré dans ce parcours. Choisis un endroit et une durée qui te conviennent aujourd’hui.", "prompt": "Complète : « J’aimerais garder cette habitude parce que… »", "tip": "Une habitude tenable peut être toute petite. Choisis-la pour toi."}], "creative": [{"title": "Dessiner sans modèle.", "body": "Choisis un objet près de toi. Observe-le, puis dessine-le sur papier sans ouvrir une image de référence. Accueille les imperfections.", "prompt": "Qu’as-tu remarqué en dessinant que tu n’avais pas vu au premier regard ?", "tip": "Un stylo et une feuille suffisent. Le résultat n’a pas à être joli."}, {"title": "Un son, une histoire.", "body": "Écoute un son autour de toi. Sur papier, invente une scène très courte dans laquelle ce son apparaît. Laisse les idées venir sans rechercher d’inspiration en ligne.", "prompt": "Commence par « J’ai entendu… » et écris la suite.", "tip": "Trois phrases peuvent déjà raconter quelque chose."}, {"title": "Une page à toi.", "body": "Prends une feuille. Écris ce qui te traverse l’esprit aujourd’hui, sans correction et sans chercher un sujet parfait. Tu peux aussi commencer par décrire ce qui t’entoure.", "prompt": "« En ce moment, je remarque… » Puis laisse ton écriture continuer.", "tip": "Tu peux t’arrêter après quelques lignes. Rien n’est noté ni évalué."}, {"title": "Une pause entre les idées.", "body": "Pose ton matériel et change doucement de position, ou marche un peu si tu le peux. Puis reviens à ta feuille et observe si une autre idée est apparue.", "prompt": "Note une idée venue pendant cette pause, même incomplète.", "tip": "Le mouvement est une possibilité, pas une obligation."}, {"title": "Trois façons d’imaginer.", "body": "Choisis un objet banal et imagine trois usages inattendus. Note-les ou dessine-les sur papier avant toute recherche et sans aide de l’IA.", "prompt": "Quelle idée te surprend le plus ? Développe-la en quelques lignes.", "tip": "Autorise-toi les idées étranges : c’est un exercice, pas un concours."}, {"title": "Créer pour quelqu’un.", "body": "Écris quelques mots ou fais un petit dessin destiné à quelqu’un. Tu peux lui offrir en personne, ou le garder pour toi.", "prompt": "Quel détail personnel as-tu choisi pour cette personne ?", "tip": "Tu n’as aucune obligation de publier ou d’envoyer ta création."}, {"title": "Garder ton élan.", "body": "Reprends une activité créative appréciée dans ce parcours. Installe ton matériel, pose le téléphone et choisis une petite réalisation possible aujourd’hui.", "prompt": "Quelle place aimerais-tu donner à cette activité dans ta semaine ?", "tip": "Laisse une feuille et un crayon accessibles pour la prochaine fois."}], "movement": [{"title": "Changer de position.", "body": "Quitte quelques instants ta position habituelle. Installe-toi autrement ou lève-toi si cela te convient. Repère ce qui paraît confortable, sans chercher une posture parfaite.", "prompt": "Qu’est-ce qui a changé dans ton ressenti après cette pause ?", "tip": "Bouge dans une amplitude confortable. Une douleur est un signal pour arrêter."}, {"title": "Une promenade attentive.", "body": "Marche à ton rythme si tu le peux, dans un endroit sûr. Tu peux aussi faire une pause assise dans un autre lieu. Écoute les sons sans regarder ton téléphone.", "prompt": "Décris un son qui t’a accompagné pendant ce moment.", "tip": "Adapte la proposition à tes possibilités, même sans sortir."}, {"title": "Du corps aux mots.", "body": "Après une courte pause ou un changement de position, prends une feuille. Décris ton énergie et ton confort avec des mots simples, sans chercher de diagnostic.", "prompt": "« Aujourd’hui, je me sens… » Écris ce qui te semble juste.", "tip": "Ton ressenti n’a pas à être positif. Il peut simplement être différent."}, {"title": "Une mobilité toute douce.", "body": "Assieds-toi de façon confortable, pieds soutenus. Si cela ne provoque aucune douleur, tourne lentement la tête d’un côté puis de l’autre, dans une petite amplitude. Reviens au centre. Tu peux préférer marcher ou changer de position.", "prompt": "Quel mouvement ou quelle position t’a semblé le plus confortable ?", "tip": "Exercice inspiré du NHS : sans forcer, sans douleur. En cas de douleur persistante, demande un avis professionnel."}, {"title": "Dessiner le mouvement.", "body": "Après un mouvement confortable ou une petite marche, dessine sur papier les lignes qui évoquent ton ressenti. Tu peux aussi rester assis et dessiner le mouvement observé dehors.", "prompt": "Ajoute trois mots à ton dessin pour décrire ton expérience.", "tip": "Quelques traits suffisent. Tu n’as rien à prouver."}, {"title": "Une pause ensemble.", "body": "Invite quelqu’un à faire une pause sans téléphone : marcher, changer d’air ou discuter. Si tu préfères, garde ce moment pour toi.", "prompt": "Qu’as-tu apprécié ou moins apprécié pendant ce moment ?", "tip": "Chacun adapte l’activité à son énergie et à ses possibilités."}, {"title": "Ta pause, à ta façon.", "body": "Reprends la pause ou le mouvement qui t’a convenu. Choisis un moment réaliste pour le refaire dans les prochains jours.", "prompt": "Quel petit changement pourrait rendre tes journées plus confortables ?", "tip": "Varier les positions et ajuster son poste peut aider au confort. Aucune posture n’est à maintenir toute la journée."}]}, "days": ["Observer", "Écouter", "Écrire", "Bouger", "Créer", "Partager", "Choisir"], "themes": [{"id": "outside", "label": "Prendre l’air", "description": "Observer, écouter, découvrir"}, {"id": "creative", "label": "Créer quelque chose", "description": "Écrire, dessiner, imaginer"}, {"id": "movement", "label": "Me remettre en mouvement", "description": "Marcher, varier mes positions"}]};
var activities = D.activities, days = D.days, themes = D.themes;
var DURATIONS = [2, 5, 10, 15];
var FEELINGS = ['calme', 'curieux', 'énergique', 'mitigé', 'sans réponse'];

var KEY = 'horschamp:v1';

var themeIds = themes.map(function (t) { return t.id; });
var CH = {"habits": [{"id": "social", "label": "Réseaux sociaux"}, {"id": "video", "label": "Vidéos courtes en boucle"}, {"id": "news", "label": "Actualités en continu"}, {"id": "games", "label": "Jeux sur mobile"}, {"id": "stream", "label": "Séries et streaming en boucle"}, {"id": "bed", "label": "Téléphone au lit"}, {"id": "notifs", "label": "Notifications non essentielles"}], "evidence": {"etabli": "Bien établi", "observe": "Observé dans des études", "hypothese": "Hypothèse plausible"}, "challenges": [{"id": "soiree", "title": "Soirée sans écran", "tagline": "Un soir pour souffler, sans engagement.", "duration": "Environ 3 heures", "level": "Facile", "tone": "lilac", "icon": "moon", "intro": "Le meilleur point de départ : ce soir, les écrans de loisir restent de côté et tu observes ce que ça change.", "prep": ["Choisis l’heure de départ et un endroit où ranger ton téléphone, hors de vue.", "Prépare une activité papier : un livre, un carnet, un jeu de cartes.", "Prévois une exception pour les vraies urgences (un appel reste possible)."], "defaultHabits": ["social", "video", "stream", "bed"], "paliers": [{"at": 0, "when": "Tout de suite", "title": "Je range le téléphone", "do": "Mets-le dans une autre pièce ou un tiroir. Dis-toi à voix haute : « ce soir, il reste là ».", "brain": "À force de répétitions, ton cerveau a appris que sortir le téléphone apporte une petite récompense rapide, et la main part toute seule. Décider à l’avance (« ce soir, il reste là ») fonctionne mieux que de se retenir à chaque fois.", "evidence": "etabli", "source": "Les plans « si… alors… » aident à tenir un objectif (méta-analyse de Gollwitzer et Sheeran, 2006).", "invite": {"theme": "outside", "day": 0}, "hy": "Active « Ne pas déranger » et pose le téléphone écran vers le bas, à plus d’un bras de toi."}, {"at": 1, "when": "Après 1 heure", "title": "L’envie va et vient", "do": "Quand l’envie de checker arrive, nomme-la dans ta tête (« tiens, une envie »), puis reprends ce que tu faisais.", "brain": "Dans les études où l’on retire le smartphone pendant 24 heures, c’est surtout l’envie de le reprendre qui augmente, pas forcément l’anxiété ni la mauvaise humeur. Une envie fonctionne souvent par vagues : elle monte, puis redescend si on ne la suit pas.", "evidence": "observe", "source": "Université de Lancaster, 2019 (revue Addictive Behaviors) : 24 h sans smartphone.", "hy": "Si tu dois le prendre (appel, minuteur), fais-le, puis repose-le sans ouvrir autre chose."}, {"at": 2, "when": "Après 2 heures", "title": "Le temps ralentit", "do": "Fais une chose lente : cuisiner, dessiner, ranger, lire quelques pages.", "brain": "Quand les temps morts ne sont plus comblés par un écran, l’esprit se met à vagabonder : souvenirs, idées, projets. Certaines personnes y trouvent du calme, d’autres de l’ennui au début. Les deux sont normaux, et l’ennui ne veut pas dire que ça ne marche pas.", "evidence": "hypothese", "invite": {"theme": "creative", "day": 2}, "hy": "Musique ou podcast autorisés, écran éteint, pour accompagner une activité lente."}, {"at": 3, "when": "Après 3 heures", "title": "Cap sur la nuit", "do": "Garde le téléphone hors de la chambre, ou au moins loin du lit. Utilise un vrai réveil.", "brain": "Un écran allumé au lit garde souvent l’esprit en alerte (fils d’actualité, messages), ce qui peut retarder l’endormissement. Dans une étude d’une semaine avec moins de réseaux sociaux, les symptômes d’insomnie ont baissé de 14,5 % en moyenne, avec de grandes différences d’une personne à l’autre.", "evidence": "observe", "source": "JAMA Network Open, novembre 2025 : 295 jeunes adultes, une semaine de réseaux sociaux réduits, sans groupe témoin.", "hy": "Garde-le pour le réveil seulement, branché loin du lit, en « Ne pas déranger »."}], "hybrid": {"intro": "Le téléphone reste là, mais en retrait : tu ne t’en sers que pour l’utile.", "rules": ["« Ne pas déranger » activé jusqu’à demain matin, avec tes proches en exception.", "Écran vers le bas, hors de portée de main.", "Autorisé : appels, musique, minuteur, carte si besoin.", "En pause : réseaux sociaux, vidéos courtes, actualités."]}}, {"id": "weekend", "title": "Aventure d’un week-end", "tagline": "48 heures pour ressentir la différence.", "duration": "48 heures", "level": "Moyen", "tone": "mint", "icon": "mountain", "intro": "Du départ au retour, tu mets de côté tes habitudes d’écran pendant tout un week-end. À chaque palier, tu découvres ce que ton cerveau peut ressentir.", "prep": ["Préviens tes proches que tu seras moins réactif·ve.", "Prévois trois activités hors écran : une dehors, une créative, une pour bouger.", "Installe un vrai réveil et une horloge ou une montre.", "Garde ce qui est utile : télécharge ou imprime à l’avance un itinéraire ou des billets."], "defaultHabits": ["social", "video", "news", "games", "stream", "bed"], "paliers": [{"at": 0, "when": "Au départ", "title": "Décollage", "do": "Choisis ton heure de départ, mets le téléphone en mode avion ou dans un tiroir, et note sur papier ce que tu veux faire ce week-end.", "brain": "Les décisions prises à l’avance sont plus faciles à tenir. Avoir des activités prêtes évite que le vide soit rempli par le réflexe d’écran.", "evidence": "etabli", "source": "Les plans « si… alors… » aident à tenir un objectif (méta-analyse de Gollwitzer et Sheeran, 2006).", "invite": {"theme": "outside", "day": 0}, "hy": "Choisis tes exceptions (proches, appels) et laisse « Ne pas déranger » faire le tri."}, {"at": 3, "when": "Après 3 heures", "title": "Le réflexe fantôme", "do": "Si ta main va chercher la poche ou si tu sens une vibration qui n’existe pas, c’est normal. Souris et continue.", "brain": "Les gestes répétés des centaines de fois se déclenchent tout seuls dans les contextes familiers (canapé, transports, attente). Beaucoup de gens décrivent même de fausses vibrations. Dans une petite étude de 41 étudiants, la séparation d’avec leur téléphone faisait monter l’anxiété et le rythme cardiaque ; sur 24 heures entières, l’étude de Lancaster n’a vu monter que l’envie. Les résultats ne vont pas tous dans le même sens.", "evidence": "observe", "source": "Université de Lancaster, 2019 (revue Addictive Behaviors) : 24 h sans smartphone.", "hy": "Si l’envie de checker arrive, attends ta fenêtre prévue plutôt que de céder tout de suite."}, {"at": 12, "when": "Après 12 heures", "title": "La première nuit", "do": "Couche-toi sans écran, avec un livre ou une musique douce. Prévois un vrai réveil pour le matin.", "brain": "Sans fil d’actualité ni messages au lit, l’esprit a moins de choses à traiter avant de dormir. Plusieurs études associent moins de réseaux sociaux à un meilleur sommeil, surtout chez des personnes qui dormaient mal. Une seule nuit ne change pas tout : vois-la comme un essai.", "evidence": "observe", "source": "JAMA Network Open, novembre 2025 : 295 jeunes adultes, une semaine de réseaux sociaux réduits, sans groupe témoin.", "hy": "Téléphone hors de la chambre ; un réveil classique si tu en as un, sinon une alarme et rien d’autre."}, {"at": 24, "when": "Après 24 heures", "title": "Un jour entier", "do": "Fais la grande activité du week-end : balade, sortie, projet manuel, repas avec quelqu’un.", "brain": "À ce stade, ce que les études mesurent surtout, c’est l’envie de reprendre le téléphone. Sur 24 heures, l’humeur et l’anxiété n’avaient pas bougé en moyenne. Si tu te sens un peu agité·e, ça arrive et ça passe souvent avec l’activité. Si c’est très inconfortable, tu peux arrêter sans te juger.", "evidence": "observe", "source": "Université de Lancaster, 2019 (revue Addictive Behaviors) : 24 h sans smartphone.", "invite": {"theme": "outside", "day": 3}, "hy": "Garde cartes et appareil photo pour la sortie, mais pas les réseaux : tu publies plus tard, ou jamais."}, {"at": 36, "when": "Après 36 heures", "title": "L’attention se pose", "do": "Essaie une activité longue sans interruption : lire 20 pages, un puzzle, une vraie conversation.", "brain": "Beaucoup de gens racontent qu’ils tiennent plus longtemps sur une même chose quand le téléphone n’est plus là. Les mesures d’attention en laboratoire montrent des effets après deux semaines, pas après un week-end : ici, c’est un avant-goût, pas une preuve.", "evidence": "hypothese", "invite": {"theme": "creative", "day": 0}, "hy": "Lis, écris ou dessine avec le téléphone en mode avion pendant l’activité."}, {"at": 48, "when": "Au retour", "title": "Retour en douceur", "do": "Reprends en deux temps : d’abord un seul usage utile, notifications éteintes pour le reste. Note ce que tu n’as pas manqué.", "brain": "Dans l’essai de deux semaines, le temps d’écran est remonté après la fin du blocage, sans retrouver tout à fait son niveau de départ. Reprendre avec des règles claires aide à garder une partie du bénéfice.", "evidence": "observe", "source": "PNAS Nexus, 2025 : essai randomisé de 2 semaines sans internet mobile, 467 adultes.", "hy": "Reprends par une seule fenêtre de 15 minutes pour tes messages, puis décide de tes règles."}], "hybrid": {"intro": "Tu gardes l’utile et tu limites le reste à de courtes fenêtres.", "rules": ["« Ne pas déranger » du début à la fin du week-end, avec tes proches en exception.", "Deux fenêtres de 15 minutes par jour pour les messages.", "Autorisé : appels, cartes, musique, photos (sans publier).", "En pause : réseaux sociaux, vidéos courtes, jeux, actualités."]}}, {"id": "semaine", "title": "Semaine reset", "tagline": "7 jours pour desserrer le réflexe.", "duration": "7 jours", "level": "Moyen", "tone": "sky", "icon": "calendar", "intro": "Une semaine pour changer tes routines : moins de scroll, plus de sommeil, plus de présence. Un format qui a été testé dans des études.", "prep": ["Coupe les notifications non essentielles et sors les applis tentantes de l’écran d’accueil.", "Charge ton téléphone hors de la chambre.", "Repère tes moments-réflexe (matin au lit, transports, attente) et prépare une alternative.", "Prévois un moment avec quelqu’un en vrai, dans la semaine."], "defaultHabits": ["social", "video", "news", "notifs", "bed"], "paliers": [{"at": 0, "when": "Jour 1", "title": "Je mets en place", "do": "Coupe les notifications non essentielles, cache les applis tentantes et charge le téléphone hors de la chambre.", "brain": "Rendre le réflexe un peu plus difficile (une appli cachée, un téléphone dans une autre pièce) réduit les usages automatiques : tu gagnes une seconde pour décider.", "evidence": "observe", "hy": "Fixe tes trois fenêtres (matin, midi, soir) et coupe tout le reste."}, {"at": 24, "when": "Jour 2", "title": "Les temps morts", "do": "Quand tu attends (file, transport), regarde autour de toi ou prends un livre.", "brain": "Les temps morts sont souvent comblés sans y penser. Les retirer laisse un vide au début, qui se remplit de pensées, d’observations, parfois d’ennui. C’est le signe que le réflexe se desserre, pas que tu fais fausse route.", "evidence": "hypothese", "invite": {"theme": "outside", "day": 0}, "hy": "Pendant un temps mort, écoute quelque chose hors ligne plutôt que de scroller."}, {"at": 72, "when": "Jour 4", "title": "Le sommeil", "do": "Fixe une heure de coucher sans écran et note sur papier comment tu t’endors.", "brain": "Après quelques jours, certaines personnes s’endorment plus vite et dorment mieux. Dans des études où l’on réduit les réseaux sociaux (de 1 à 3 semaines), les symptômes d’insomnie ou le temps de sommeil se sont améliorés en moyenne, mais les résultats varient beaucoup selon les personnes.", "evidence": "observe", "source": "JAMA Network Open, novembre 2025 : 295 jeunes adultes, une semaine de réseaux sociaux réduits, sans groupe témoin.", "hy": "Fixe une heure à la dernière fenêtre du soir, puis téléphone hors de la chambre."}, {"at": 120, "when": "Jour 6", "title": "L’humeur", "do": "Écris trois mots sur ton humeur du jour, sur papier, puis appelle ou retrouve quelqu’un en vrai.", "brain": "Dans un essai randomisé d’une semaine sans réseaux sociaux, le bien-être et l’anxiété se sont améliorés, et la dépression aussi chez les personnes qui avaient déjà des symptômes. Ce sont des moyennes : certaines personnes ne ressentent presque rien, et c’est normal.", "evidence": "observe", "source": "Essai randomisé d’une semaine sans réseaux sociaux, 154 adultes (Cyberpsychology, Behavior and Social Networking, 2022).", "invite": {"theme": "outside", "day": 5}, "hy": "Réserve ton quota de réseaux à une fenêtre, et note ton humeur avant et après."}, {"at": 168, "when": "Jour 7", "title": "Le bilan", "do": "Regarde ce que tu as gagné (temps, sommeil, humeur) et choisis une ou deux règles à garder.", "brain": "Une semaine suffit pour sentir une différence chez beaucoup de gens, mais les études suggèrent que les bénéfices sont plus nets à partir de 10 jours à 2 semaines. Tu peux enchaîner avec la détox complète si l’envie est là.", "evidence": "observe", "source": "PNAS Nexus, 2025 : essai randomisé de 2 semaines sans internet mobile, 467 adultes.", "hy": "Compte les jours où tu as respecté tes fenêtres, sans chercher la perfection."}], "hybrid": {"intro": "Trois fenêtres par jour pour tout le reste : c’est le rythme testé dans les études sur les notifications.", "rules": ["Notifications coupées, sauf appels et messages de tes proches.", "Trois fenêtres par jour (matin, midi, soir) pour le reste.", "Téléphone hors de la chambre la nuit.", "Réseaux sociaux : environ 30 minutes par jour au plus, pendant une fenêtre."]}}, {"id": "complete", "title": "Détox complète", "tagline": "30 jours pour changer de rythme pour de bon.", "duration": "30 jours", "level": "Ambitieux", "tone": "pink", "icon": "star", "intro": "Le grand défi : un mois pour remplacer tes réflexes d’écran par d’autres habitudes. Tu gardes ce qui est utile (appels, travail, banque, cartes) et tu mets le reste de côté.", "prep": ["Liste ce qui est vraiment utile et que tu gardes : appels, messages importants, banque, cartes, travail.", "Supprime ou bloque les applis tentantes, function windowStatus(now, wins) {
  if (!wins.length) return { kind: 'none' };
  var m = now.getHours() * 60 + now.getMinutes();
  var sorted = wins.slice().sort(function (a, b) { return toMin(a.start) - toMin(b.start); });
  for (var i = 0; i < sorted.length; i++) if (m >= toMin(sorted[i].start) && m < toMin(sorted[i].end)) return { kind: 'open', end: sorted[i].end, left: toMin(sorted[i].end) - m };
  for (var j = 0; j < sorted.length; j++) if (toMin(sorted[j].start) > m) return { kind: 'next', start: sorted[j].start, inMin: toMin(sorted[j].start) - m, tomorrow: false };
  return { kind: 'next', start: sorted[0].start, inMin: 24 * 60 - m + toMin(sorted[0].start), tomorrow: true };
}

    : '<button class="text-button" data-fk="reset-ask" data-action="resetAsk">Effacer mon suivi de cet appareil</button>';
  return '<section class="preferences-page"><div class="greeting"><p class="eyebrow">UN PARCOURS QUI TE RESSEMBLE</p><h1>Ce qui te<br><span>fait envie.</span></h1><p>Ces préférences servent de point de départ. Tu peux changer chaque activité.</p></div>' +
    '<form data-form="prefs">' + settingsFieldsets() + '<fieldset><legend>J’aimerais surtout…</legend><div class="theme-options">' +
    themes.map(function (t) { return '<label class="theme-option' + (S.theme === t.id ? ' selected' : '') + '"><input type="radio" name="theme" value="' + t.id + '" data-fk="pref-' + t.id + '" data-change="prefTheme"' + (S.theme === t.id ? ' checked' : '') + '><span><strong>' + esc(t.label) + '</strong><small>' + esc(t.description) + '</small></span></label>'; }).join('') +
    '</div></fieldset><fieldset><legend>Un moment qui tient dans ma journée</legend><div class="choice-row">' +
    DURATIONS.map(function (d) { return '<button type="button" class="chip' + (S.duration === d ? ' active' : '') + '" aria-pressed="' + (S.duration === d) + '" data-fk="dur-' + d + '" data-action="duration" data-v="' + d + '">' + d + ' minutes</button>'; }).join('') +
    '</div></fieldset><button class="primary-button" type="submit">Garder ces préférences</button></form>' +
    '<div class="preference-note"><h2>Moins de sollicitations.</h2><p>Cette version n’envoie aucune notification. Reviens quand tu le souhaites ; tu n’as rien à rattraper.</p>' +
    '<p>Pour bouger, reste dans une amplitude confortable et arrête si cela provoque une douleur. Une douleur persistante mérite un avis professionnel.</p>' +
    '<a class="source-link" href="https://www.inrs.fr/risques/travail-ecran/prevention-risques" target="_blank" rel="noreferrer">Conseils de l’INRS sur les pauses et le poste de travail</a></div>' +
    '<div class="preference-note"><h2>Tes données.</h2><p>Tout est enregistré dans ce navigateur, sur cet appareil (moments, défis, médailles). Rien n’est envoyé sur Internet. Vider les données du site dans ton navigateur efface aussi ton suivi.</p>' + reset + '</div></section>';
}

function swipeAllowed() { return !(S.tab === 'moment' && S.phase !== 'choose'); }
function swipeDots() {
  if (!swipeAllowed()) return '';
  var i = TABS.indexOf(S.tab);
  return '<div class="swipe-dots" aria-hidden="true">' + TABS.map(function (_, k) { return '<span class="dot' + (k === i ? ' on' : '') + '"></span>'; }).join('') + '</div>' +
    (S.hint ? '<p class="swipe-hint" aria-hidden="true">Glisse vers la gauche ou la droite pour changer de rubrique</p>' : '');
}
function view() {
  var main = banners();
  if (S.tab === 'moment') main += S.phase === 'away' ? viewAway() : S.phase === 'reflect' ? viewReflect() : viewChoose();
  else if (S.tab === 'challenges') main += S.ch.view ? viewChallenge(S.ch.view) : viewChallenges();
  else if (S.tab === 'map') main += viewMap();
  else if (S.tab === 'journey') main += viewJourney();
  else main += viewPrefs();
  return header() + '<main>' + main + '</main>' + swipeDots() + '<footer>Un outil pour poser ton téléphone, puis se faire oublier.<span>ARISE · version web · suivi enregistré sur cet appareil</span></footer>';
}

/* ---------- Rendu et interactions ---------- */
function render(opts) {
  opts = opts || {};
  var active = document.activeElement, fk = active && active.dataset ? active.dataset.fk : null, y = window.scrollY;
  app.innerHTML = view();
  if (opts.top) window.scrollTo({ top: 0, behavior: 'instant' }); else window.scrollTo({ top: y, behavior: 'instant' });
  if (opts.slide) {
    var m = app.querySelector('main'), cls = 'slide-in-' + opts.slide;
    if (m) { m.classList.add(cls); m.addEventListener('animationend', function () { m.classList.remove(cls); }, { once: true }); }
  }
  var target = opts.focus ? app.querySelector(opts.focus) : (fk ? app.querySelector('[data-fk="' + fk + '"]') : null);
  if (target) target.focus({ preventScroll: true });
}


function startChallenge(id) {
  if (data.challenge.active) { S.notice = 'Tu as déjà un défi en cours : termine-le ou arrête-le avant d’en commencer un autre.'; render({ top: true }); return; }
  var def = chById(id);
  data.challenge.active = { id: id, startedAt: new Date().toISOString(), habits: selectedHabits(def), done: [] };
  var ok = persist();
  S.ch.open[id + ':0'] = true; S.ch.stopAsk = false;
  S.notice = ok ? 'C’est parti ! Ton défi est enregistré sur cet appareil. Tu peux fermer cette page et revenir plus tard.' : 'C’est parti ! Ton navigateur ne peut pas conserver le défi : garde cette page ouverte.';
  render({ top: true, focus: '#ch-title' });
}
function validatePalier(i) {
  var run = data.challenge.active;
  if (!run) return;
  var def = chById(run.id);
  if (i < 0 || i >= def.paliers.length || def.paliers[i].at > elapsedH(run) || run.done.indexOf(i) >= 0) return;
  run.done.push(i);
  if (run.done.length === def.paliers.length) {
    data.challenge.finished.unshift({ id: run.id, startedAt: run.startedAt, endedAt: new Date().toISOString(), status: 'finished', done: def.paliers.length });
    data.challenge.active = null; S.ch.view = null; S.ch.stopAsk = false;
    S.notice = 'Défi terminé, bravo ! Ta médaille t’attend en bas de cette page.';
    persist(); render({ top: true }); return;
  }
  var ok = persist();
  S.notice = ok ? 'Palier validé. Bien joué !' : 'Palier validé pour cette visite, mais ton navigateur ne peut pas le conserver.';
  render();
}
function stopChallenge() {
  var run = data.challenge.active;
  if (!run) return;
  data.challenge.finished.unshift({ id: run.id, startedAt: run.startedAt, endedAt: new Date().toISOString(), status: 'stopped', done: run.done.length });
  if (data.challenge.finished.length > 100) data.challenge.finished.length = 100;
  data.challenge.active = null; S.ch.view = null; S.ch.stopAsk = false;
  persist();
  S.notice = 'Défi arrêté, sans souci. Tu pourras le reprendre quand tu veux.';
  render({ top: true });
}

function selectDay(i) {
  var m = momentFor(i);
  S.day = i;
  if (m) { S.theme = m.theme; S.duration = m.duration; S.feeling = m.feeling; S.wrote = !!m.wrote; }
  else { S.theme = data.profile.theme; S.duration = data.profile.duration; S.feeling = 'sans réponse'; S.wrote = false; }
  S.tab = 'moment'; S.phase = 'choose'; S.notice = '';
  render({ top: true });
}
function pick(theme, day) {
  S.theme = theme; S.day = day; S.feeling = 'sans réponse'; S.wrote = false;
  S.tab = 'moment'; S.phase = 'choose'; S.notice = '';
  render({ top: true });
}
function complete() {
  var id = data.history.reduce(function (m, h) { return Math.max(m, h.id); }, 0) + 1;
  data.history.unshift({ id: id, day: S.day, theme: S.theme, duration: S.duration, feeling: S.feeling, wrote: S.wrote ? 1 : 0, completedAt: new Date().toISOString() });
  if (data.history.length > 500) data.history.length = 500;
  var ok = persist();
  S.phase = 'choose'; S.tab = 'journey'; S.shown = PAGE;
  S.notice = ok ? 'Ton moment est enregistré sur cet appareil. Tu peux fermer cette page et revenir quand tu le souhaites.'
    : 'Ton moment est noté pour cette visite, mais ton navigateur ne permet pas de le conserver.';
  render({ top: true });
}
function savePrefs() {
  var d = draftOf();
  if (d.mode === 'hybrid' && !validWindows(d.windows)) { S.formError = 'Vérifie tes fenêtres : l’heure de fin doit être après l’heure de début, pour chacune.'; render(); return; }
  data.profile = { theme: S.theme, duration: S.duration, mode: d.mode, essentials: d.essentials.slice(), windows: d.windows.map(function (w) { return { start: w.start, end: w.end }; }) };
  S.draft = null; S.formError = '';
  var ok = persist();
  S.notice = ok ? 'Tes envies sont sauvegardées.' : 'Tes envies sont prises en compte pour cette visite, mais ton navigateur ne permet pas de les conserver.';
  render({ top: true });
}
function resetAll() {
  data = fresh();
  try { localStorage.removeItem(KEY); } catch (e) { /* rien à effacer */ }
  S.resetAsk = false; S.ch = { view: null, open: {}, habits: {}, stopAsk: false }; S.day = 0; S.theme = 'outside'; S.duration = 5; S.feeling = 'sans réponse'; S.wrote = false; S.shown = PAGE;
  S.notice = 'Ton suivi a été effacé de cet appareil.';
  render({ top: true });
}

app.addEventListener('click', function (e) {
  var t = e.target.closest('[data-action]');
  if (!t || !app.contains(t)) return;
  var a = t.dataset.action, v = t.dataset.v;
  switch (a) {
    case 'nav': S.tab = v; S.notice = ''; S.phase = 'choose'; S.resetAsk = false; S.ch.view = null; S.ch.stopAsk = false; S.draft = null; S.formError = ''; render({ top: true }); break;
    case 'theme': S.theme = v; render(); break;
    case 'duration': S.duration = Number(v); render(); break;
    case 'selectDay': selectDay(Number(v)); break;
    case 'start': S.feeling = 'sans réponse'; S.wrote = false; S.phase = 'away'; S.notice = ''; render({ top: true, focus: '#away-title' }); break;
    case 'back': case 'later': case 'discard': S.phase = 'choose'; render({ top: true }); break;
    case 'took': S.phase = 'reflect'; render({ top: true, focus: '#reflect-title' }); break;
    case 'feeling': S.feeling = v; render(); break;
    case 'surprise': var s = pickSuggestion(); pick(s.theme, s.day); break;
    case 'pick': pick(t.dataset.theme, Number(t.dataset.day)); break;
    case 'more': S.shown += PAGE; render(); break;
    case 'resetAsk': S.resetAsk = true; render({ focus: '[data-fk="reset-no"]' }); break;
    case 'resetNo': S.resetAsk = false; render({ focus: '[data-fk="reset-ask"]' }); break;
    case 'resetYes': resetAll(); break;
    case 'openChallenge': S.tab = 'challenges'; S.ch.view = v; S.ch.stopAsk = false; S.notice = ''; render({ top: true, focus: '#ch-title' }); break;
    case 'closeChallenge': S.ch.view = null; S.ch.stopAsk = false; render({ top: true }); break;
    case 'toggleHabit': var def0 = chById(S.ch.view), cur = selectedHabits(def0), k = cur.indexOf(v); if (k >= 0) cur.splice(k, 1); else cur.push(v); S.ch.habits[def0.id] = cur; render(); break;
    case 'startChallenge': startChallenge(v); break;
    case 'togglePalier': S.ch.open[v] = !S.ch.open[v]; render(); break;
    case 'validate': validatePalier(Number(v)); break;
    case 'stopAsk': S.ch.stopAsk = true; render({ focus: '[data-fk="stop-no"]' }); break;
    case 'stopNo': S.ch.stopAsk = false; render({ focus: '[data-fk="stop-ask"]' }); break;
    case 'stopYes': stopChallenge(); break;
    case 'setMode': setMode(v); break;
    case 'toggleEss': var de = draftOf(), ke = de.essentials.indexOf(v); if (ke >= 0) de.essentials.splice(ke, 1); else de.essentials.push(v); render(); break;
    case 'addWin': var dw = draftOf(); if (dw.windows.length < HY.maxWindows) dw.windows.push({ start: '15:30', end: '15:45' }); S.formError = ''; render({ focus: '[data-fk="add-win"]' }); break;
    case 'delWin': draftOf().windows.splice(Number(v), 1); S.formError = ''; render(); break;
    case 'mapPin': S.map.sel = v; render({ focus: '#map-detail-title' }); var d = document.getElementById('map-detail'); if (d) d.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); break;
    case 'mapRandom': var cs = MP.categories.filter(function (c) { return c.id !== S.map.sel; }); S.map.sel = cs[Math.floor(Math.random() * cs.length)].id; render({ focus: '#map-detail-title' }); var d2 = document.getElementById('map-detail'); if (d2) d2.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); break;
  }
});
app.addEventListener('submit', function (e) {
  var f = e.target.dataset.form;
  if (!f) return;
  e.preventDefault();
  if (f === 'save') complete(); else if (f === 'prefs') savePrefs();
});
app.addEventListener('change', function (e) {
  var c = e.target.dataset.change;
  if (c === 'wrote') S.wrote = e.target.checked;
  else if (c === 'durationSelect') S.duration = Number(e.target.value);
  else if (c === 'prefTheme') { S.theme = e.target.value; render(); }
  else if (c === 'draftMode') { draftOf().mode = e.target.value; render(); }
  else if (c === 'winStart') { draftOf().windows[Number(e.target.dataset.i)].start = e.target.value; S.formError = ''; }
  else if (c === 'winEnd') { draftOf().windows[Number(e.target.dataset.i)].end = e.target.value; S.formError = ''; }
});

/* ---------- Glisser pour changer de rubrique (téléphone) ---------- */
function canGo(dir) {
  if (!swipeAllowed()) return false;
  if (S.tab === 'challenges' && S.ch.view) return true;   // dans un défi : « précédent » revient à la liste
  var i = TABS.indexOf(S.tab) + (dir === 'next' ? 1 : -1);
  return i >= 0 && i < TABS.length;
}
function goSwipe(dir) {
  if (dir === 'prev' && S.tab === 'challenges' && S.ch.view) { S.ch.view = null; S.ch.stopAsk = false; }
  else {
    S.tab = TABS[TABS.indexOf(S.tab) + (dir === 'next' ? 1 : -1)];
    S.notice = ''; S.phase = 'choose'; S.resetAsk = false; S.ch.view = null; S.ch.stopAsk = false; S.draft = null; S.formError = '';
  }
  S.hint = false;
  render({ top: true, slide: dir });
}
var SW = { x: 0, y: 0, t: 0, active: false, dragging: false, dx: 0 };
function noSwipeZone(el) {
  while (el && el !== app && el.nodeType === 1) {
    var n = el.nodeName;
    if (n === 'SELECT' || n === 'TEXTAREA') return true;
    if (n === 'INPUT' && ['radio', 'checkbox', 'button', 'submit'].indexOf(el.type) < 0) return true;   // champs de saisie et curseurs : on ne vole pas le geste
    if (el.scrollWidth > el.clientWidth + 2) { var ox = getComputedStyle(el).overflowX; if (ox === 'auto' || ox === 'scroll') return true; }
    el = el.parentNode;
  }
  return false;
}
function snapBack() {
  var m = app.querySelector('main');
  SW.active = false; SW.dragging = false;
  if (!m) return;
  m.style.transition = 'transform .2s ease, opacity .2s ease'; m.style.transform = ''; m.style.opacity = '';
  setTimeout(function () { m.style.transition = ''; }, 230);
}
function finishSwipe() {
  if (!SW.active || !SW.dragging) { SW.active = false; return; }
  var dx = SW.dx, dir = dx < 0 ? 'next' : 'prev', dt = Math.max(1, Date.now() - SW.t), fast = Math.abs(dx) / dt > 0.45;
  var commit = canGo(dir) && (Math.abs(dx) >= 80 || (Math.abs(dx) >= 40 && fast));
  SW.active = false; SW.dragging = false;
  if (!commit) { snapBack(); return; }
  var m = app.querySelector('main');
  if (!m || window.matchMedia('(prefers-reduced-motion: reduce)').matches) { goSwipe(dir); return; }
  m.style.transition = 'transform .15s ease-in, opacity .15s ease-in';
  m.style.transform = 'translateX(' + (dir === 'next' ? -1 : 1) * Math.round(window.innerWidth * 0.35) + 'px)'; m.style.opacity = '0';
  setTimeout(function () { goSwipe(dir); }, 150);
}
app.addEventListener('touchstart', function (e) {
  SW.active = false;
  if (e.touches.length !== 1 || !swipeAllowed() || noSwipeZone(e.target)) return;
  var t = e.touches[0];
  SW.x = t.clientX; SW.y = t.clientY; SW.t = Date.now(); SW.active = true; SW.dragging = false; SW.dx = 0;
}, { passive: true });
app.addEventListener('touchmove', function (e) {
  if (!SW.active) return;
  var t = e.touches[0], dx = t.clientX - SW.x, dy = t.clientY - SW.y;
  if (!SW.dragging) {
    if (Math.abs(dy) > 10 && Math.abs(dy) >= Math.abs(dx) * 0.8) { SW.active = false; return; }   // défilement vertical : on laisse faire
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.2) SW.dragging = true; else return;
  }
  var m = app.querySelector('main');
  if (!m) return;
  SW.dx = dx;
  m.style.transition = 'none';
  m.style.transform = 'translateX(' + Math.round(dx * (canGo(dx < 0 ? 'next' : 'prev') ? 0.6 : 0.18)) + 'px)';   // résistance au bout du parcours
  m.style.opacity = String(1 - Math.min(Math.abs(dx), 260) / 260 * 0.5);
}, { passive: true });
app.addEventListener('touchend', finishSwipe, { passive: true });
app.addEventListener('touchcancel', function () { if (SW.dragging) snapBack(); SW.active = false; }, { passive: true });

setInterval(function () { if (isHybrid() && S.tab === 'moment' && S.phase === 'choose') render(); }, 30000);
var lastPending = pendingCount();
setInterval(function () {
  if (!data.challenge.active) return;
  var now = pendingCount();
  if (now !== lastPending || S.tab === 'challenges') { lastPending = now; render(); }
}, 60000);

render();
})();
</script>
